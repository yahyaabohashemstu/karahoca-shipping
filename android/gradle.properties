org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Room writes its schema JSON here so migrations can be diffed in review.
# A schema change with no accompanying Migration is a data-loss bug for us
# (see TrackerDatabase: no fallbackToDestructiveMigration).
room.incremental=true

ksp.incremental=true

# Point the release build at production without editing build.gradle.kts:
#   ./gradlew assembleRelease -PkhApiBaseUrl=https://track.karahoca.com/api/v1/
# khApiBaseUrl=https://track.karahoca.com/api/v1/
