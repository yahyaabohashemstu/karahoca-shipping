[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
hilt = "2.53.1"
androidxHiltWork = "1.2.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
room = "2.6.1"
work = "2.10.0"
datastore = "1.1.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
retrofitSerialization = "1.0.0"
playServicesLocation = "21.3.0"
coroutines = "1.9.0"
zxing = "3.5.3"
cameraX = "1.4.1"
mlkitBarcode = "17.3.0"
desugar = "2.1.4"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                       version.ref = "coreKtx" }
androidx-appcompat          = { module = "androidx.appcompat:appcompat",                 version = "1.7.0" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",     version.ref = "lifecycle" }
# collectAsStateWithLifecycle() lives here, not in lifecycle-runtime-ktx.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service  = { module = "androidx.lifecycle:lifecycle-service",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",           version.ref = "activityCompose" }

compose-bom                 = { module = "androidx.compose:compose-bom",                 version.ref = "composeBom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-graphics         = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3           = { module = "androidx.compose.material3:material3" }
compose-material-icons      = { module = "androidx.compose.material:material-icons-extended" }

room-runtime                = { module = "androidx.room:room-runtime",                   version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx",                       version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler",                  version.ref = "room" }

work-runtime                = { module = "androidx.work:work-runtime-ktx",               version.ref = "work" }
hilt-android                = { module = "com.google.dagger:hilt-android",               version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-android-compiler",      version.ref = "hilt" }
hilt-work                   = { module = "androidx.hilt:hilt-work",                      version.ref = "androidxHiltWork" }
hilt-work-compiler          = { module = "androidx.hilt:hilt-compiler",                  version.ref = "androidxHiltWork" }
hilt-navigation-compose     = { module = "androidx.hilt:hilt-navigation-compose",        version = "1.2.0" }

datastore-preferences       = { module = "androidx.datastore:datastore-preferences",     version.ref = "datastore" }
security-crypto             = { module = "androidx.security:security-crypto",            version = "1.1.0-alpha06" }

retrofit                    = { module = "com.squareup.retrofit2:retrofit",              version.ref = "retrofit" }
retrofit-serialization      = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp",                  version.ref = "okhttp" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor",     version.ref = "okhttp" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
play-services-location      = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
# Explicit, not transitive: DeviceInfoProvider references GoogleApiAvailability
# at compile time, and relying on a transitive of play-services-location is how
# a version bump breaks the build.
play-services-base          = { module = "com.google.android.gms:play-services-base", version = "18.5.0" }

camera-core                 = { module = "androidx.camera:camera-core",                  version.ref = "cameraX" }
camera-camera2              = { module = "androidx.camera:camera-camera2",               version.ref = "cameraX" }
camera-lifecycle            = { module = "androidx.camera:camera-lifecycle",             version.ref = "cameraX" }
camera-view                 = { module = "androidx.camera:camera-view",                  version.ref = "cameraX" }
mlkit-barcode               = { module = "com.google.mlkit:barcode-scanning",            version.ref = "mlkitBarcode" }

desugar-jdk-libs            = { module = "com.android.tools:desugar_jdk_libs",           version.ref = "desugar" }

# JVM tests. Robolectric runs the real Room database on a real SQLite without a
# device, which is what makes a "does the database even open" test cheap enough
# to run on every build.
junit                       = { module = "junit:junit",                                  version = "4.13.2" }
robolectric                 = { module = "org.robolectric:robolectric",                  version = "4.14.1" }
androidx-test-core          = { module = "androidx.test:core",                           version = "1.6.1" }
coroutines-test             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application    = { id = "com.android.application",                 version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android",          version.ref = "hilt" }
