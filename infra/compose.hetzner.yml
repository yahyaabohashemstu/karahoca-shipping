# =============================================================================
# KaraHoca Shipping — deployment onto the EXISTING shared Hetzner box
# =============================================================================
# This is NOT the generic production compose. It is tuned for one specific,
# already-occupied server:
#
#   ubuntu-4gb-nbg1-1   2 vCPU · 3.7 GB RAM · 75 GB disk
#   already running     karahoca.com, www, api.karahoca.com, yukleme.*,
#                       clonelens.com, and Coolify itself
#   free at deploy time ~1.6 GB RAM, with 1.1 GB of swap ALREADY in use
#
# Three consequences drive every choice below.
#
# 1. HARD MEMORY CAPS ON EVERYTHING.
#    The root compose asks Postgres for shared_buffers=4GB — on this box that
#    is an instant OOM for the company website. Every service here has an
#    explicit limit, so a leak or a runaway query in the tracking system can
#    only kill the tracking system. Total ceiling ~1.33 GB.
#
# 2. NO CADDY, NO PUBLISHED PORTS.
#    Coolify's Traefik owns :80 and :443. Services join the external `coolify`
#    network and are routed by labels. Postgres and Redis stay on a private
#    network with no host ports at all — they are not reachable from outside
#    the compose project, let alone the internet.
#
# 3. ONE HOSTNAME, PATH-ROUTED.
#    track.karahoca.com serves both the API and the dashboard. Same-origin
#    means CORS stops being a moving part, and there is only one certificate
#    to renew.
#
#   docker compose -f infra/compose.hetzner.yml --env-file .env.hetzner up -d
# =============================================================================

name: karahoca

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ===========================================================================
  # PostgreSQL 16 + TimescaleDB 2.17.2 + PostGIS — private, capped, no ports
  # ===========================================================================
  # NAMED kh-postgres, NOT postgres. This is not cosmetic.
  #
  # The api and web containers join the shared `coolify` network so Traefik can
  # route to them, and Docker resolves DNS across EVERY attached network with
  # no way to scope a lookup to one. Coolify's own containers carry these
  # aliases on that network:
  #
  #     coolify-db     aliases = [coolify-db, postgres]
  #     coolify-redis  aliases = [coolify-redis, redis]
  #
  # So a service called `postgres` here means the API resolves `postgres` to
  # COOLIFY'S CONTROL-PLANE DATABASE. The first deploy failed with
  # "NOAUTH Authentication required" from Coolify's Redis, which was lucky:
  # had credentials happened to match, this application would have been
  # pointed at the database that runs the server's hosting platform.
  #
  # Any rename back to a generic name reintroduces that.
  # ===========================================================================
  kh-postgres:
    image: timescale/timescaledb-ha:pg16.6-ts2.17.2-all
    restart: unless-stopped
    logging: *logging
    # 128 MB, not 1 GB: parallel workers are capped at 2 on a 2-vCPU box, so
    # large shared sort buffers would be reserved and never used.
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karahoca}
      POSTGRES_USER: ${POSTGRES_USER:-karahoca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      # ---- Sized for a 640 MB container on a SHARED 3.7 GB host -------------
      - -c
      - max_connections=40
      - -c
      - shared_buffers=160MB
      # Deliberately conservative: this is a planner hint about the OS page
      # cache, and on a shared box most of that cache belongs to other people.
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=4MB
      # 1 GB, not 8: bounded WAL keeps the 75 GB disk predictable.
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # 2 vCPU shared with five other apps — parallelism here steals from them.
      - -c
      - timescaledb.max_background_workers=2
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_locks_per_transaction=128
      - -c
      - log_min_duration_statement=2000
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karahoca} -d ${POSTGRES_DB:-karahoca}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 640M
    networks: [internal]

  # ===========================================================================
  # Redis — derived state only, so a tiny cap and LRU eviction are correct
  # ===========================================================================
  # kh-redis, not redis — see the note on kh-postgres above.
  # ===========================================================================
  kh-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 80M
    networks: [internal]

  # ===========================================================================
  # Migrations — runs once, exits; the API is gated on it completing
  # ===========================================================================
  migrate:
    build:
      context: ../db
    image: karahoca/migrate:latest
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karahoca}:${POSTGRES_PASSWORD}@kh-postgres:5432/${POSTGRES_DB:-karahoca}
    depends_on:
      kh-postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [internal]

  # ===========================================================================
  # API — /api/*, /realtime, /t/*
  # ===========================================================================
  api:
    build:
      context: ../apps/api
    image: karahoca/api:latest
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      # Node's heap must sit BELOW the container cap or the kernel OOM-killer
      # gets there before V8's own GC does.
      NODE_OPTIONS: "--max-old-space-size=224"
      PORT: 4000
      HOST: 0.0.0.0
      API_PREFIX: api/v1
      PUBLIC_API_URL: https://${APP_DOMAIN}
      # Same-origin: the dashboard is served from this very hostname.
      CORS_ORIGINS: https://${APP_DOMAIN}
      TRUST_PROXY: "true"

      DATABASE_URL: postgres://${POSTGRES_USER:-karahoca}:${POSTGRES_PASSWORD}@kh-postgres:5432/${POSTGRES_DB:-karahoca}
      # 40 server-side max, shared with the migrate job and psql sessions.
      DB_POOL_MAX: 12
      REDIS_URL: redis://kh-redis:6379

      JWT_USER_SECRET: ${JWT_USER_SECRET:?required}
      JWT_DRIVER_SECRET: ${JWT_DRIVER_SECRET:?required}
      INGEST_KEY_SECRET: ${INGEST_KEY_SECRET:?required}

      INGEST_REQUIRE_HMAC: "true"
      INGEST_MAX_BATCH_POINTS: ${INGEST_MAX_BATCH_POINTS:-2000}
      SESSION_CLAIM_TTL_MIN: ${SESSION_CLAIM_TTL_MIN:-720}
      DEEP_LINK_SCHEME: karahoca
      DEEP_LINK_PACKAGE: ${DEEP_LINK_PACKAGE:-com.karahoca.tracker}
      APK_DOWNLOAD_URL: ${APK_DOWNLOAD_URL:-}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-KaraHoca Admin}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      kh-postgres: { condition: service_healthy }
      kh-redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 320M
    networks: [internal, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # Priority 100 beats the dashboard's catch-all. Three prefixes, because
      # the driver app needs /api and /realtime, and the printed QR code
      # resolves to the short /t/<code> hand-off page.
      - traefik.http.routers.kh-api-http.entryPoints=http
      - traefik.http.routers.kh-api-http.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/t/`))
      - traefik.http.routers.kh-api-http.priority=100
      - traefik.http.routers.kh-api-http.middlewares=kh-to-https
      - traefik.http.routers.kh-api-http.service=kh-api

      - traefik.http.routers.kh-api.entryPoints=https
      - traefik.http.routers.kh-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/t/`))
      - traefik.http.routers.kh-api.priority=100
      - traefik.http.routers.kh-api.tls=true
      - traefik.http.routers.kh-api.tls.certresolver=letsencrypt
      - traefik.http.routers.kh-api.service=kh-api

      - traefik.http.services.kh-api.loadbalancer.server.port=4000
      - traefik.http.middlewares.kh-to-https.redirectscheme.scheme=https

  # ===========================================================================
  # Dashboard — everything else on the hostname
  # ===========================================================================
  web:
    build:
      context: ../apps/web
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the bundle.
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api/v1
        NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-https://tiles.openfreemap.org/styles/liberty}
        NODE_BUILD_MEMORY: ${NODE_BUILD_MEMORY:-700}
    image: karahoca/web:latest
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=200"
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 288M
    networks: [internal, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      - traefik.http.routers.kh-web-http.entryPoints=http
      - traefik.http.routers.kh-web-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.kh-web-http.priority=1
      - traefik.http.routers.kh-web-http.middlewares=kh-to-https
      - traefik.http.routers.kh-web-http.service=kh-web

      - traefik.http.routers.kh-web.entryPoints=https
      - traefik.http.routers.kh-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.kh-web.priority=1
      - traefik.http.routers.kh-web.tls=true
      - traefik.http.routers.kh-web.tls.certresolver=letsencrypt
      - traefik.http.routers.kh-web.middlewares=kh-gzip
      - traefik.http.routers.kh-web.service=kh-web

      - traefik.http.services.kh-web.loadbalancer.server.port=3000
      - traefik.http.middlewares.kh-gzip.compress=true

volumes:
  postgres_data:
    driver: local

networks:
  # Private. Postgres and Redis are reachable only from these containers —
  # no host ports, not on the proxy network.
  internal:
    driver: bridge
  # Owned by Coolify. Never let compose try to create or remove it.
  coolify:
    external: true
