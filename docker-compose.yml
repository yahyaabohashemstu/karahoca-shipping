# =============================================================================
# KaraHoca Shipping — full stack
# =============================================================================
# Target: a single Hetzner CCX23 (4 vCPU / 16 GB / 160 GB NVMe) managed by
# Coolify. Coolify supplies the reverse proxy, TLS and secrets, so no proxy
# service is defined here by default — see the `edge` profile for standalone
# deployment without Coolify.
#
#   docker compose up -d --build                     # production
#   docker compose --profile dev up -d --build       # + exposed DB/Redis ports
#   docker compose --profile edge up -d --build      # + Caddy TLS terminator
#   docker compose --profile backup up -d            # + nightly pg_dump sidecar
#
# =============================================================================

name: karahoca

# A plain anchor, not a `<<:` merge key. Docker Compose resolves merge keys, but
# plenty of surrounding tooling (linters, js-yaml-based CI checks, some IDE
# plugins) silently does not — and a compose file that lints differently from
# how it runs is worse than three repeated lines. `restart:` is inlined per
# service for the same reason.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ===========================================================================
  # PostgreSQL 16 + TimescaleDB + PostGIS
  # ===========================================================================
  postgres:
    image: timescale/timescaledb-ha:pg16.6-ts2.17.2-all
    restart: unless-stopped
    logging: *default-logging
    shm_size: 1gb          # parallel workers and large sorts need shared memory
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karahoca}
      POSTGRES_USER: ${POSTGRES_USER:-karahoca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Never trust host locale for a database that stores UTC timestamps.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # ---- Tuned for 16 GB RAM, write-heavy time-series ---------------------
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - shared_buffers=4GB              # 25% of RAM
      - -c
      - effective_cache_size=12GB       # 75% of RAM — planner hint only
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB        # compression + index builds
      - -c
      - wal_buffers=16MB
      # Batch ingest commits in bursts; a larger WAL means far fewer checkpoints.
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      # NVMe: random reads are nearly as cheap as sequential ones.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - timescaledb.max_background_workers=8
      - -c
      - max_worker_processes=16
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=2
      # Observability
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      - -c
      - pg_stat_statements.track=all
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karahoca} -d ${POSTGRES_DB:-karahoca}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [karahoca]

  # Dev-only: expose 5432 to the host for psql / DBeaver. Never in production —
  # Postgres must not be reachable from outside the compose network.
  postgres-dev-ports:
    image: alpine/socat:1.8.0.0
    profiles: ["dev"]
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432
    ports: ["5432:5432"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [karahoca]
    restart: unless-stopped

  # ===========================================================================
  # Redis — pub/sub, hot session auth cache, HMAC nonces, leader locks
  # ===========================================================================
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "no"                      # holds no durable truth (ADR-004)
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru               # evicting a cached session auth costs one query
      - --tcp-keepalive
      - "60"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [karahoca]

  # ===========================================================================
  # Migrations — runs to completion, then exits. The API waits for it.
  # ===========================================================================
  migrate:
    build:
      context: ./db
    image: karahoca/migrate:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karahoca}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karahoca}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [karahoca]
    restart: "no"
    logging: *default-logging

  # ===========================================================================
  # API — REST + Socket.IO gateway + scheduled maintenance
  # ===========================================================================
  api:
    build:
      context: ./apps/api
    image: karahoca/api:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://track.karahoca.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://panel.karahoca.com}
      TRUST_PROXY: "true"

      DATABASE_URL: postgres://${POSTGRES_USER:-karahoca}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karahoca}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_URL: redis://redis:6379

      # ---- Secrets. Generate each with: openssl rand -base64 48 -------------
      JWT_USER_SECRET: ${JWT_USER_SECRET:?JWT_USER_SECRET is required}
      JWT_DRIVER_SECRET: ${JWT_DRIVER_SECRET:?JWT_DRIVER_SECRET is required}
      # Rotating this makes every stored ingest key undecryptable and forces a
      # re-claim on every live session. Treat it as permanent.
      INGEST_KEY_SECRET: ${INGEST_KEY_SECRET:?INGEST_KEY_SECRET is required}

      INGEST_REQUIRE_HMAC: ${INGEST_REQUIRE_HMAC:-true}
      INGEST_MAX_BATCH_POINTS: ${INGEST_MAX_BATCH_POINTS:-5000}
      HMAC_SKEW_SEC: ${HMAC_SKEW_SEC:-600}

      SESSION_CLAIM_TTL_MIN: ${SESSION_CLAIM_TTL_MIN:-720}
      SESSION_MAX_LIFETIME_HOURS: ${SESSION_MAX_LIFETIME_HOURS:-72}
      DEEP_LINK_SCHEME: ${DEEP_LINK_SCHEME:-karahoca}

      # First-boot only; remove after the admin account exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-KaraHoca Admin}

      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      # Coolify's proxy binds this; drop the host binding entirely if the proxy
      # joins the karahoca network directly.
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [karahoca]

  # ===========================================================================
  # Web command center
  # ===========================================================================
  web:
    build:
      context: ./apps/web
      args:
        # NEXT_PUBLIC_* is inlined at build time — changing these needs a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://track.karahoca.com/api/v1}
        NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-https://tiles.openfreemap.org/styles/liberty}
    image: karahoca/web:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [karahoca]

  # ===========================================================================
  # Caddy — only when deploying WITHOUT Coolify
  # ===========================================================================
  caddy:
    image: caddy:2.9-alpine
    profiles: ["edge"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-track.karahoca.com}
      WEB_DOMAIN: ${WEB_DOMAIN:-panel.karahoca.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@karahoca.com}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [karahoca]

  # ===========================================================================
  # Backups — nightly logical dump + weekly full, retained locally and pushed
  # to a Hetzner Storage Box over SFTP.
  # ===========================================================================
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-karahoca}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-karahoca}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infra/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [karahoca]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backups:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  karahoca:
    driver: bridge
